# Kirim reverse proxy: the single public entry point.
#
#   /            web app (static files built from web/)
#   /api/        transfer API          -> api:8080
#   /risk/       risk service          -> risk-service:8081 (prefix stripped)
#   /auth/       Keycloak (login, tokens, admin console) -> keycloak:8080
#   actuator     not exposed here: health and metrics are for the platform, not the internet

# Per client IP. A burst is allowed, sustained abuse gets 429 before it reaches Java.
limit_req_zone $binary_remote_addr zone=kirim_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=kirim_login:10m rate=5r/s;
limit_req_status 429;

# Docker's DNS. Upstreams are resolved per request (through variables below),
# so nginx starts, and keeps running, even when one service is stopped
# (e.g. the API is being debugged in IntelliJ): that route answers 502 instead.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    set $kirim_api      http://api:8080;
    set $kirim_risk     http://risk-service:8081;
    set $kirim_keycloak http://keycloak:8080;

    add_header X-Request-Id           $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        no-referrer always;

    # ---- transfer API
    location /api/ {
        limit_req zone=kirim_api burst=40 nodelay;
        include /etc/nginx/snippets/kirim-proxy-headers.conf;
        proxy_pass $kirim_api;
    }

    # API docs of the transfer API (Swagger UI + OpenAPI JSON)
    location ~ ^/(swagger-ui|v3/api-docs) {
        include /etc/nginx/snippets/kirim-proxy-headers.conf;
        proxy_pass $kirim_api;
    }

    # ---- risk service, served under /risk (OPS only; the service checks the token)
    location /risk/actuator {
        return 404;
    }
    location /risk/ {
        limit_req zone=kirim_api burst=40 nodelay;
        include /etc/nginx/snippets/kirim-proxy-headers.conf;
        proxy_set_header X-Forwarded-Prefix /risk;
        rewrite ^/risk/(.*)$ /$1 break;
        proxy_pass $kirim_risk;
    }

    # ---- Keycloak
    # The token endpoint is where passwords are checked: tighter limit against guessing.
    location /auth/realms/kirim/protocol/openid-connect/token {
        limit_req zone=kirim_login burst=10 nodelay;
        include /etc/nginx/snippets/kirim-proxy-headers.conf;
        proxy_pass $kirim_keycloak;
    }
    location /auth/ {
        include /etc/nginx/snippets/kirim-proxy-headers.conf;
        # Keycloak sends large headers and cookies.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass $kirim_keycloak;
    }
    location = /auth {
        return 301 /auth/;
    }

    # ---- internal endpoints never go through the public entry point
    location /actuator {
        return 404;
    }

    # ---- web app: a single-page app, so unknown paths fall back to index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
