# The transfer API. Two replicas is safe by design:
#  - the outbox relay claims rows with FOR UPDATE SKIP LOCKED, so instances never send the same event twice at once
#  - the rate-limit counters live in Redis, shared by every replica
#  - the notification consumer is one Kafka consumer group, partitions are split between replicas
apiVersion: v1
kind: Service
metadata:
  name: kirim-api
  labels:
    app.kubernetes.io/name: kirim-api
spec:
  selector:
    app.kubernetes.io/name: kirim-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirim-api
  labels:
    app.kubernetes.io/name: kirim-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kirim-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kirim-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kirim-api
      containers:
        - name: api
          image: kirim-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kirim-api-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kirim-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kirim-db
                  key: password
          # Spring Boot exposes these groups when it detects Kubernetes (and via
          # management.endpoint.health.probes.enabled). Readiness checks PostgreSQL
          # only; see application.yml for why Redis is left out.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30 # up to 150s for JVM start + Flyway
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the Service time to stop routing here before Spring starts its graceful shutdown.
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Tomcat's work directory; the rest of the filesystem is read-only
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kirim-api
spec:
  minAvailable: 1 # node drains and cluster upgrades keep at least one API pod serving
  selector:
    matchLabels:
      app.kubernetes.io/name: kirim-api
