# Local stack.
#   docker compose up --build -d                -> everything, behind the reverse proxy on http://localhost
#   docker compose up -d postgres kafka redis keycloak nginx
#                                               -> infra + login + proxy; run the services from your IDE
# Entry point: http://localhost (web app), /api (transfer API), /risk (risk service), /auth (Keycloak).
# The API (:8080) and risk service (:8081) ports stay published for debugging only.
# Ports and the public URL can be changed in .env: API_PORT, REDIS_PORT, PROXY_PORT, KIRIM_PUBLIC_URL.
# If you created the postgres volume before the risk service existed, run
# `docker compose down -v` once so the kirim_risk database gets created.

# Tokens must name the same issuer that clients log in through (the proxy URL),
# while services fetch signing keys from Keycloak directly inside the network.
x-kirim-auth: &kirim-auth
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KIRIM_PUBLIC_URL:-http://localhost}/auth/realms/kirim
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/kirim/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kirim
      POSTGRES_USER: kirim
      POSTGRES_PASSWORD: kirim
    ports:
      - "5433:5432"
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirim"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *kirim-auth
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kirim
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  risk-service:
    build: ./risk-service
    ports:
      - "8081:8081"
    environment:
      <<: *kirim-auth
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kirim_risk
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Login server (OAuth2 / OpenID Connect). Development mode: in-memory H2
  # database, realm "kirim" with its users imported on every fresh start.
  # Admin console: http://localhost/auth/admin (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # Every token says it was issued by the public URL, whichever way Keycloak was reached.
      KC_HOSTNAME: ${KIRIM_PUBLIC_URL:-http://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: ask the management port with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Reverse proxy and web app: the single public entry point.
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "${PROXY_PORT:-80}:80"
    depends_on:
      - api
      - risk-service
      - keycloak
