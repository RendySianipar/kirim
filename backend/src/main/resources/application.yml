server:
  port: 8081

spring:
  application:
    name: kirim
  datasource:
    url: jdbc:postgresql://localhost:5433/kirim
    username: kirim
    password: kirim
  data:
    redis:
      host: localhost
      port: 6379
      # Short timeouts: the rate limiter fails open, so a slow Redis must not
      # hold the transfer transaction (and its row locks) for long.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast so the outbox relay can back off instead of blocking.
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
    consumer:
      group-id: kirim-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness for Kubernetes
      group:
        readiness:
          # Ready = can serve transfers = PostgreSQL is up. Redis is left out on
          # purpose: the app keeps working without it (rate limiter fails open,
          # cache misses go to the DB), so a Redis outage must not take pods out
          # of the Service.
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

kirim:
  rate-limit:
    enabled: true
    transfers-per-window: 10 # new transfers per source account...
    window: 1m               # ...per minute
    fail-open: true
  cache:
    transfers:
      enabled: true
      ttl: 10m
  transfer:
    max-amount: 50000000 # Rp 50.000.000 per transfer
  outbox:
    topic: transfer-events
    scheduler-enabled: true
    poll-interval-ms: 500
    batch-size: 50
    max-attempts: 8
    initial-backoff: 1s
    backoff-multiplier: 2.0
    max-backoff: 5m
