spring:
  datasource:
    hikari:
      # The concurrency tests run 16 threads at once.
      maximum-pool-size: 20

kirim:
  rate-limit:
    # High enough for the concurrency tests; RateLimitIntegrationTest lowers it.
    transfers-per-window: 100000
  outbox:
    scheduler-enabled: false
  reconciliation:
    scheduler-enabled: false
